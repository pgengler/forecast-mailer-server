# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/opt/postgresql@16/bin/pg_config
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: forecast_mailer_development
  host: localhost

test:
  <<: *default
  database: forecast_mailer_test
  host: localhost

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

# Solid Queue uses a separate database connection (same Postgres instance).
# In production it shares DATABASE_URL; in dev/test it uses the app database.
queue: &queue
  <<: *default

production_queue:
  <<: *queue
  url: <%= ENV["DATABASE_URL"] %>

development_queue:
  <<: *queue
  database: forecast_mailer_development
  host: localhost

test_queue:
  <<: *queue
  database: forecast_mailer_test
  host: localhost
